x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://urban_user:urban_password@postgis:5432/airflow_db
  AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
  AIRFLOW__WEBSERVER__SECRET_KEY: 'urban_platform_secret_key'
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW_CONN_URBAN_DB: postgresql+psycopg2://urban_user:urban_password@postgis:5432/urban_db
  DATABASE_URL: postgresql+psycopg2://urban_user:urban_password@postgis:5432/urban_db

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags
  - ./logs/airflow:/opt/airflow/logs
  - ./docker/airflow/plugins:/opt/airflow/plugins
  - .:/opt/airflow/urban_platform
  - ./requirements-airflow.txt:/requirements-airflow.txt
  - airflow_packages:/home/airflow/.local

services:

  # ─────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4
    container_name: urban_platform_db
    environment:
      POSTGRES_DB: urban_db
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: urban_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban_user -d urban_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # AIRFLOW (ETL pipeline) — profile: etl
  # ─────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.10.3-python3.12
    container_name: urban_platform_airflow_init
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      postgis:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        pip install -r /requirements-airflow.txt --quiet
        airflow db migrate
        airflow users create --username admin --password admin --firstname Urban --lastname Admin --role Admin --email admin@urban.local || true
    profiles:
      - etl

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.12
    container_name: urban_platform_airflow_scheduler
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      postgis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        airflow scheduler
    restart: unless-stopped
    profiles:
      - etl

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.12
    container_name: urban_platform_airflow_webserver
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    depends_on:
      postgis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        airflow webserver
    restart: unless-stopped
    profiles:
      - etl

  # ─────────────────────────────────────────
  # STREAMLIT — profile: app
  # ─────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: urban_platform_streamlit
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: urban_db
      DB_USER: urban_user
      DB_PASSWORD: urban_password
      DATABASE_URL: postgresql+psycopg2://urban_user:urban_password@postgis:5432/urban_db
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      postgis:
        condition: service_healthy
    profiles:
      - app

  # ─────────────────────────────────────────
  # MLFLOW — profile: ml
  # Experiment tracking server (UI: http://localhost:5000)
  # ─────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: urban_platform_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped
    profiles:
      - ml

  # ─────────────────────────────────────────
  # ML PIPELINE — profile: ml
  # One-shot container; run via:
  #   docker compose --profile ml run --rm ml
  #   docker compose --profile ml run --rm ml python src/ml/run_pipeline.py --config configs/ml/my_run.yaml
  # ─────────────────────────────────────────
  ml:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: urban_platform_ml
    environment:
      DATABASE_URL: postgresql+psycopg2://urban_user:urban_password@postgis:5432/urban_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
    depends_on:
      postgis:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["python", "src/ml/run_pipeline.py", "--config", "configs/ml/default_run.yaml"]
    profiles:
      - ml

volumes:
  postgres_data:
  airflow_packages:
  pip_cache:
  mlflow_data:
